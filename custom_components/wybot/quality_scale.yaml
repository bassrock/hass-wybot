# Progress toward the Home Assistant Integration Quality Scale (target: Silver).
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
rules:
  # --- Bronze ---
  action-setup:
    status: exempt
    comment: The integration does not register any global service actions.
  appropriate-polling:
    status: done
    comment: DataUpdateCoordinator polls every 30 seconds (BLE/MQTT/HTTP).
  brands:
    status: done
    comment: >-
      Brand icons/logos ship in the integration's brand/ folder (local brand
      images, supported since Home Assistant 2026.3).
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: done
    comment: >-
      The WyBot client is the pywybot PyPI package (github.com/bassrock/pywybot),
      pinned in manifest requirements.
  docs-actions:
    status: exempt
    comment: No service actions are provided.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # --- Silver ---
  action-exceptions:
    status: done
    comment: Vacuum and button entity actions raise HomeAssistantError on failure.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >-
      _async_update_data raises UpdateFailed when no data is available, so the
      DataUpdateCoordinator logs once on failure and once on recovery.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: 99% coverage on the HA test harness (pytest-homeassistant-custom-component).

  # --- Gold ---
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info:
    status: done
    comment: Bluetooth re-discovery updates the stored device address on the entry.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: Platforms create entities for devices added to the account after setup.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: >-
      The only user-actionable failure is invalid credentials, which is handled by
      the reauthentication flow; other failures (BLE/cloud unreachable) auto-recover.
  stale-devices:
    status: done
    comment: >-
      Devices removed from the account are purged from the registry, and manual
      removal is allowed via async_remove_config_entry_device.

  # --- Platinum ---
  async-dependency:
    status: done
    comment: The pywybot dependency is fully async (aiohttp / aiomqtt / bleak).
  inject-websession:
    status: done
    comment: >-
      WyBotHTTPClient accepts an aiohttp session; the integration passes Home
      Assistant's shared session via async_get_clientsession.
  strict-typing:
    status: done
    comment: >-
      Passes mypy --strict (CI-enforced), and depends on the strictly-typed,
      py.typed pywybot package.
